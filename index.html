    <!-- Console Filter to suppress third-party browser extensions, WebGPU Windows spam, and YouTube widget API warnings -->
    <script>
      (function() {
        // 1. Suppress Chromium Windows WebGPU powerPreference warning
        try {
          if (typeof navigator !== 'undefined' && navigator.gpu && typeof navigator.gpu.requestAdapter === 'function') {
            const origRequestAdapter = navigator.gpu.requestAdapter.bind(navigator.gpu);
            navigator.gpu.requestAdapter = function(options) {
              if (options && typeof options === 'object' && options.powerPreference) {
                const { powerPreference, ...rest } = options;
                return origRequestAdapter(rest);
              }
              return origRequestAdapter(options);
            };
          }
        } catch (_) {}

        const origError = console.error;
        const origWarn = console.warn;
        const origLog = console.log;

        const noiseKeywords = [
          'chrome-extension',
          'couponCollection',
          '[BHK]',
          'affiliateCashback',
          'powerPreference',
          'requestAdapter',
          'React DevTools',
          'web_accessible_resources',
          'Failed to fetch dynamically imported module',
          'message channel closed',
          'A listener indicated an asynchronous response',
          'target origin provided',
          "Failed to execute 'postMessage'",
          'navigator.vibrate',
          'Blocked call to navigator.vibrate'
        ];

        function matchesNoise(args) {
          try {
            const text = Array.from(args).map(arg => {
              if (arg instanceof Error) return arg.message + ' ' + (arg.stack || '');
              if (typeof arg === 'object') {
                try { return JSON.stringify(arg); } catch (_) { return String(arg); }
              }
              return String(arg);
            }).join(' ');
            return noiseKeywords.some(kw => text.includes(kw));
          } catch (_) {
            return false;
          }
        }

        console.error = function(...args) {
          if (!matchesNoise(args)) origError.apply(console, args);
        };
        console.warn = function(...args) {
          if (!matchesNoise(args)) origWarn.apply(console, args);
        };
        console.log = function(...args) {
          if (!matchesNoise(args)) origLog.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          const msg = String(event.message || '');
          const file = String(event.filename || '');
          if (
            file.includes('chrome-extension') ||
            msg.includes('chrome-extension') ||
            msg.includes('couponCollection') ||
            msg.includes('Failed to fetch dynamically imported module') ||
            msg.includes('Denying load of') ||
            msg.includes('web_accessible_resources')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason ? String(event.reason.message || event.reason.stack || event.reason) : '';
          if (
            reason.includes('message channel closed') ||
            reason.includes('A listener indicated an asynchronous response') ||
            reason.includes('chrome-extension') ||
            reason.includes('couponCollection') ||
            reason.includes('Failed to fetch dynamically imported module')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
